[project]
name = "j105-history"
version = "0.1.0"
description = "North American J/105 results database, keyed by sail number"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
]

[project.scripts]
j105 = "j105.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/j105"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Puget Sound-era scripts kept as reference only; port code out of them rather than editing them.
extend-exclude = ["collect/legacy"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
